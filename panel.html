<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Panel del Emprendedor</title>
<style>body{margin:0;background:#eef1f6;font-family:Segoe UI,sans-serif}.top{background:#111827;color:#fff;padding:20px;display:flex;justify-content:space-between;position:sticky;top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;padding:22px;max-width:1240px;margin:auto}.card{background:#fff;padding:18px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.06)}.btn{background:#6c5ce7;color:#fff;border:0;padding:12px 20px;border-radius:12px;cursor:pointer}</style>
</head>
<body>
<div class="top"><div><h2 style="margin:0">👤 Panel del Emprendedor</h2><small id="pUserInfo"></small></div><button class="btn" onclick="location.href='index.html'">← Volver a la app</button></div>
<div class="grid">
<div class="card"><h3>📊 Mi cuenta</h3><div id="panelContent"></div><button class="btn" onclick="logout()">Cerrar sesión</button></div>
<div class="card"><h3>💰 Mis finanzas</h3><div id="pFinanzas"></div></div>
<div class="card"><h3>📦 Mi stock</h3><div id="pStock"></div></div>
<div class="card"><h3>🧮 Mis cálculos</h3><div id="pCalc"></div></div>
<div class="card"><h3>✨ Mis descripciones</h3><div id="pDesc"></div></div>
<div class="card"><h3>🎨 Mis diseños</h3><div id="pDisenos"></div></div>
<div class="card"><h3>🚀 Mis solicitudes Impulsar</h3><div id="pImpulsar"></div></div>
<div class="card"><h3>📱 Mis posts</h3><div id="pPost"></div></div>
<div class="card"><h3>🤖 Mis consejos</h3><div id="pChat"></div></div>
</div>

<script>
const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbw3wMObY1MO5g3oMqoxHUj1UUw1celYPgP9cEQHt0-I57RBaikBLa-O_X5tgGvYkJr1CQ/exec";

function getUsers(){try{return JSON.parse(localStorage.getItem('users_db')||'{}')}catch(e){return {}}}
function dkey(){return 'emp_data_'+(localStorage.getItem('sess')||'anon')}
function getData(){try{let r=localStorage.getItem(dkey());return r?JSON.parse(r):{finanzas:[],stock:[],calc:[],descrip:[],disenos:[],post:[],chat:[],mkt:[],impulsar:[]}}catch(e){return {finanzas:[],stock:[],calc:[],descrip:[],disenos:[],post:[],chat:[],mkt:[],impulsar:[]}}}

function render(){
  let sess=localStorage.getItem('sess');
  if(!sess){document.body.innerHTML='<div style="padding:40px;text-align:center"><h2>Tenés que iniciar sesión primero</h2><button class="btn" onclick="location.href=`index.html`">Ir al login</button></div>';return;}
  let users=getUsers(); let u=users[sess];
  if(!u){document.getElementById('pUserInfo').textContent=sess; document.getElementById('panelContent').innerHTML='<b>'+sess+'</b>';}
  else{document.getElementById('pUserInfo').textContent=u.n+' • '+u.e; document.getElementById('panelContent').innerHTML='<b>'+u.n+'</b><br>'+u.e+'<br><small>Registro: '+new Date(u.created).toLocaleDateString()+'</small>';}

  let d=getData();
  document.getElementById('pFinanzas').innerHTML=d.finanzas.map(f=>'<div style="background:#f8fafc;padding:10px;border-radius:10px;margin:6px 0"><b>'+(f.cuenta||'')+'</b> ('+(f.fecha||'')+')<br>Ing:$'+(f.ing||0)+' Egr:$'+(f.egr||0)+' <b>Bal:$'+(f.bal||0)+'</b></div>').join('')||'Sin datos';
  document.getElementById('pStock').innerHTML=d.stock.map(s=>'<div style="background:#f8fafc;padding:10px;border-radius:10px;margin:6px 0">📦 <b>'+s.n+'</b> x'+s.c+' Costo $'+s.co+' Venta $'+s.mi+' Final $'+s.fi+'</div>').join('')||'Sin datos';
  document.getElementById('pCalc').innerHTML=d.calc.map(c=>'<div style="background:#f8fafc;padding:10px;border-radius:10px;margin:6px 0">'+(c.txt||c)+'</div>').join('')||'Sin datos';
  document.getElementById('pDesc').innerHTML=d.descrip.map(c=>'<div style="background:#f8fafc;padding:10px;border-radius:10px;margin:6px 0">'+c+'</div>').join('')||'Sin datos';
  document.getElementById('pDisenos').innerHTML=d.disenos.map(c=>'<div style="background:#f8fafc;padding:10px;border-radius:10px;margin:6px 0">'+c+'</div>').join('')||'Sin datos';
  document.getElementById('pPost').innerHTML=d.post.map(c=>'<div style="background:#f8fafc;padding:10px;border-radius:10px;margin:6px 0">'+c+'</div>').join('')||'Sin datos';
  document.getElementById('pChat').innerHTML=d.chat.map(c=>'<div style="background:#f8fafc;padding:10px;border-radius:10px;margin:6px 0">'+c+'</div>').join('')||'Sin datos';
  document.getElementById('pImpulsar').innerHTML=d.impulsar.map(c=>'<div style="background:#f8fafc;padding:10px;border-radius:10px;margin:6px 0">🚀 <b>'+(c.prod||c.producto||'')+'</b><br>'+(c.nom||'')+' - '+(c.ciu||'')+'<br>WP: '+(c.wpp||'')+'</div>').join('')||'Sin datos';
}

function logout(){localStorage.removeItem('sess'); location.href='index.html';}

// Escucha cambios en tiempo real del index.html
window.addEventListener('storage', (e)=>{
  if(e.key && e.key.startsWith('emp_data_')) render();
});

render();
setInterval(render, 2000); // refresca cada 2 seg por si acaso
</script>
</body>
</html>
